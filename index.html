<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdPilot — AI Ad-Creative Autopilot for D2C India</title>
<meta name="description" content="AdPilot scores hooks, predicts winning creatives, auto-pauses losers and runs the creative testing loop end-to-end for D2C brands in India.">
<style>
/* ============ AdPilot design system ============ */
:root{
  --pri:#6d5ef2; --pri2:#8b7cff; --pri-soft:rgba(109,94,242,.14);
  --teal:#2dd4bf; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa; --pink:#f472b6;
  --wa:#25d366; --wa-deep:#128c4b;
  --rad:14px; --rad2:10px; --rad3:8px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --shadow2:0 4px 14px rgba(0,0,0,.25);
  --sidebar-w:250px;
}
:root[data-theme="dark"]{
  --bg:#0b0e14; --bg2:#0e1219; --card:#141927; --card2:#1a2130; --hover:#1e2637;
  --line:#232b3b; --line2:#2e3849;
  --tx:#e9edf5; --tx2:#9aa5b8; --tx3:#69738c;
  --code-bg:#1a2130;
}
:root[data-theme="light"]{
  --bg:#f4f5fa; --bg2:#eef0f6; --card:#ffffff; --card2:#f7f8fc; --hover:#eef1f8;
  --line:#e3e7f0; --line2:#d4dae6;
  --tx:#1a2233; --tx2:#5b6577; --tx3:#8a93a5;
  --shadow:0 10px 30px rgba(30,40,80,.12); --shadow2:0 4px 14px rgba(30,40,80,.08);
  --code-bg:#f0f2f8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,"Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--pri2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:var(--rad3);padding:8px 12px;outline:none;transition:border-color .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
input::placeholder,textarea::placeholder{color:var(--tx3)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--pri2);outline-offset:2px;border-radius:4px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
kbd,.kbd{background:var(--card2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--tx2)}
/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40}
.side-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#b44df0);display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 34px;box-shadow:0 4px 12px rgba(109,94,242,.4)}
.logo-mark svg{width:19px;height:19px}
.brand-name{font-weight:800;font-size:16.5px;letter-spacing:-.3px}
.brand-name em{font-style:normal;color:var(--pri2)}
.plan-pill{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--teal);background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.3);padding:1px 7px;border-radius:20px;margin-left:auto;text-transform:uppercase}
.ws-switch{margin:4px 12px 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad2);padding:9px 11px;display:flex;align-items:center;gap:9px;width:calc(100% - 24px);text-align:left;transition:border-color .15s}
.ws-switch:hover{border-color:var(--line2)}
.ws-dot{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:0 0 26px}
.ws-name{font-weight:600;font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-sub{font-size:10.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-chev{margin-left:auto;color:var(--tx3);flex:0 0 auto}
nav#nav{flex:1;padding:4px 12px 12px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);padding:14px 10px 5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7.5px 10px;border-radius:var(--rad3);color:var(--tx2);font-weight:500;font-size:13.2px;margin:1px 0;transition:background .12s,color .12s;position:relative}
.nav-item:hover{background:var(--hover);color:var(--tx);text-decoration:none}
.nav-item.active{background:var(--pri-soft);color:var(--pri2);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--pri2),var(--pri))}
.nav-item svg{width:16.5px;height:16.5px;flex:0 0 16.5px}
.nav-count{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:0 7px;color:var(--tx3)}
.nav-count.hot{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.35);color:var(--bad)}
.side-foot{padding:12px;border-top:1px solid var(--line)}
.side-user{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad2);padding:8px 10px}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:0 0 28px}
.side-user .nm{font-size:12.5px;font-weight:600;line-height:1.15}
.side-user .rl{font-size:10.5px;color:var(--tx3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:30}
.tb-title h1{font-size:16.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.tb-title p{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.tb-spacer{flex:1}
.tb-search{width:230px;background:var(--card2);border:1px solid var(--line);border-radius:var(--rad2);display:flex;align-items:center;gap:8px;padding:7px 11px;color:var(--tx3);cursor:text}
.tb-search:hover{border-color:var(--line2)}
.tb-search svg{width:14px;height:14px;flex:0 0 14px}
.tb-search span{font-size:12.5px;flex:1}
.icon-btn{width:34px;height:34px;border-radius:var(--rad2);display:flex;align-items:center;justify-content:center;color:var(--tx2);border:1px solid transparent;position:relative;transition:background .12s}
.icon-btn:hover{background:var(--hover);color:var(--tx)}
.icon-btn svg{width:17px;height:17px}
.icon-btn .bdg-dot{position:absolute;top:5px;right:5px;min-width:15px;height:15px;border-radius:20px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--bg)}
.hamb{display:none}
.view{padding:22px;max-width:1480px;width:100%;margin:0 auto;animation:vin .18s ease}
@keyframes vin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.view-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.view-head h2{font-size:21px;font-weight:800;letter-spacing:-.4px}
.view-head .sub{color:var(--tx2);font-size:13px;margin-top:3px;max-width:720px}
.view-head .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ---------- Cards & grids ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow2)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14px;font-weight:700;letter-spacing:-.2px}
.card-h .hint{font-size:11.5px;color:var(--tx3);font-weight:400}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px}
.card-b.tight{padding:10px}
.g{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g23{display:grid;gap:14px;grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:1050px){.g23{grid-template-columns:1fr}}
/* ---------- Stats ---------- */
.stat{padding:15px 16px}
.stat .lb{font-size:11.5px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px}
.stat .lb svg{width:13px;height:13px;color:var(--tx3)}
.stat .v{font-size:23px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.stat .delta{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--ok)} .delta.dn{color:var(--bad)} .delta.flat{color:var(--tx3)}
.delta svg{width:12px;height:12px}
/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--rad3);font-weight:600;font-size:13px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);transition:all .13s;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:linear-gradient(135deg,var(--pri),#8b4ff0);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(109,94,242,.35)}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
.btn.ok{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.4);color:var(--ok)}
.btn.ok:hover{border-color:var(--ok);color:var(--ok);filter:brightness(1.1)}
.btn.danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.4);color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.wa{background:var(--wa);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(37,211,102,.3)}
.btn.wa:hover{filter:brightness(1.08);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.sm svg{width:13px;height:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-link{color:var(--pri2);font-weight:600;font-size:12.5px}
.btn-link:hover{text-decoration:underline}
/* ---------- Badges / chips / pills ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:20px;letter-spacing:.2px;white-space:nowrap}
.badge svg{width:11px;height:11px}
.b-ok{background:rgba(52,211,153,.13);color:var(--ok);border:1px solid rgba(52,211,153,.35)}
.b-warn{background:rgba(251,191,36,.13);color:var(--warn);border:1px solid rgba(251,191,36,.35)}
.b-bad{background:rgba(248,113,113,.13);color:var(--bad);border:1px solid rgba(248,113,113,.35)}
.b-info{background:rgba(96,165,250,.13);color:var(--info);border:1px solid rgba(96,165,250,.35)}
.b-pri{background:var(--pri-soft);color:var(--pri2);border:1px solid rgba(139,124,255,.4)}
.b-n{background:var(--card2);color:var(--tx2);border:1px solid var(--line2)}
.b-teal{background:rgba(45,212,191,.12);color:var(--teal);border:1px solid rgba(45,212,191,.35)}
.b-wa{background:rgba(37,211,102,.13);color:var(--wa);border:1px solid rgba(37,211,102,.4)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.pri{background:var(--pri2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4.5px 11px;border-radius:20px;border:1px solid var(--line2);background:var(--card2);color:var(--tx2);cursor:pointer;transition:all .12s;white-space:nowrap}
.chip:hover{border-color:var(--pri);color:var(--tx)}
.chip.active{background:var(--pri-soft);border-color:var(--pri);color:var(--pri2)}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border-radius:0 0 var(--rad) var(--rad)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card2)}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--pri2)}
.tbl th .arr{font-size:9px;margin-left:3px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:var(--hover)}
.tbl td.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.tbl .cell-main{font-weight:600}
.tbl .cell-sub{font-size:11.5px;color:var(--tx3);margin-top:1px}
/* ---------- Progress / bars ---------- */
.bar{height:7px;border-radius:20px;background:var(--card2);border:1px solid var(--line);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .5s ease}
.bar.ok>i{background:linear-gradient(90deg,#10b981,#34d399)}
.bar.warn>i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar.bad>i{background:linear-gradient(90deg,#ef4444,#f87171)}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar-row .bl{font-size:12px;color:var(--tx2);width:118px;flex:0 0 118px}
.bar-row .bar{flex:1}
.bar-row .bv{font-size:12px;font-weight:700;width:34px;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 34px}
/* ---------- Score ring ---------- */
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring .rv{position:absolute;font-weight:800;font-variant-numeric:tabular-nums}
/* ---------- Tabs / segmented ---------- */
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;font-size:13px;font-weight:600;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .12s}
.tab:hover{color:var(--tx)}
.tab.active{color:var(--pri2);border-bottom-color:var(--pri)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:var(--rad3);padding:3px;gap:2px}
.seg button{padding:4.5px 12px;font-size:12px;font-weight:600;border-radius:6px;color:var(--tx2);transition:all .12s}
.seg button.active{background:var(--pri-soft);color:var(--pri2)}
.seg button:hover:not(.active){color:var(--tx)}
/* ---------- Switch ---------- */
.switch{position:relative;display:inline-flex;align-items:center;flex:0 0 auto}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .tr{width:36px;height:20px;border-radius:20px;background:var(--line2);transition:background .15s;position:relative;flex:0 0 36px}
.switch .tr::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+.tr{background:var(--ok)}
.switch input:checked+.tr::after{left:19px}
.switch input:focus-visible+.tr{outline:2px solid var(--pri2);outline-offset:2px}
/* ---------- Forms ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.field .req{color:var(--bad)}
.input-lg{width:100%;padding:11px 14px;font-size:14px}
textarea{width:100%;resize:vertical;min-height:74px}
.form-row{display:flex;gap:10px}
.form-row>*{flex:1}
.help-tx{font-size:11.5px;color:var(--tx3);margin-top:4px}
/* ---------- Dropzone ---------- */
.dropzone{border:2px dashed var(--line2);border-radius:var(--rad);padding:38px 20px;text-align:center;background:var(--card2);transition:all .15s;cursor:pointer}
.dropzone:hover{border-color:var(--pri2)}
.dropzone.drag{border-color:var(--pri);background:var(--pri-soft);transform:scale(1.005)}
.dropzone .dz-ic{width:52px;height:52px;border-radius:14px;background:var(--pri-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--pri2)}
.dropzone .dz-ic svg{width:24px;height:24px}
.dropzone h4{font-size:15px;font-weight:700}
.dropzone p{font-size:12.5px;color:var(--tx2);margin-top:4px}
.dropzone .fmt{font-size:11px;color:var(--tx3);margin-top:10px}
/* ---------- Verdict / verdict tiles ---------- */
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 13px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase}
.v-win{background:rgba(52,211,153,.15);color:var(--ok);border:1.5px solid rgba(52,211,153,.45)}
.v-prom{background:rgba(96,165,250,.14);color:var(--info);border:1.5px solid rgba(96,165,250,.4)}
.v-weak{background:rgba(251,191,36,.14);color:var(--warn);border:1.5px solid rgba(251,191,36,.4)}
.v-lose{background:rgba(248,113,113,.14);color:var(--bad);border:1.5px solid rgba(248,113,113,.4)}
/* ---------- Creative mock tiles ---------- */
.creative-tile{border-radius:var(--rad2);border:1px solid var(--line);overflow:hidden;position:relative;background:linear-gradient(150deg,var(--card2),var(--card));aspect-ratio:1/.92;display:flex;flex-direction:column}
.creative-tile .ct-viz{flex:1;position:relative;overflow:hidden}
.creative-tile .ct-bar{padding:8px 10px;border-top:1px solid var(--line);background:var(--card2)}
.ct-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--tx3);font-size:11px;font-weight:600}
.play-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:20px;padding:2px 8px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:4px;backdrop-filter:blur(3px)}
/* ---------- Hover-action tiles ---------- */
.tile{position:relative}
.tile .tile-actions{position:absolute;top:8px;right:8px;display:flex;gap:5px;opacity:0;transition:opacity .15s;z-index:3}
.tile:hover .tile-actions{opacity:1}
.tile .tile-actions .icon-btn{background:rgba(10,12,20,.72);color:#fff;border:none;width:28px;height:28px;backdrop-filter:blur(4px)}
.tile .tile-actions .icon-btn svg{width:14px;height:14px}
/* ---------- Gallery ---------- */
.gallery{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.gl-item{cursor:pointer}
.gl-item .creative-tile{aspect-ratio:1/.8}
/* ---------- Heatmap / calendar ---------- */
.heat{display:grid;grid-template-columns:44px repeat(24,1fr);gap:2px;font-size:9px}
.heat .hl{display:flex;align-items:center;justify-content:center;color:var(--tx3);font-weight:600;font-size:9.5px}
.heat .hc{aspect-ratio:1/.92;border-radius:3px;cursor:pointer;transition:transform .1s;min-width:0}
.heat .hc:hover{transform:scale(1.18);outline:1.5px solid var(--pri2);z-index:2}
.heat .hh{display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);text-align:center;padding:4px 0}
.cal .day{min-height:86px;background:var(--card2);border:1px solid var(--line);border-radius:var(--rad3);padding:7px;font-size:12px;cursor:pointer;transition:border-color .12s}
.cal .day:hover{border-color:var(--pri2)}
.cal .day.dim{opacity:.38}
.cal .day.today{border-color:var(--pri);background:var(--pri-soft)}
.cal .day .dnum{font-weight:700;font-size:12px}
.cal .ev{margin-top:5px;font-size:10px;font-weight:600;border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.c-ok{background:rgba(52,211,153,.16);color:var(--ok)}
.ev.c-pri{background:rgba(139,124,255,.18);color:var(--pri2)}
.ev.c-warn{background:rgba(251,191,36,.16);color:var(--warn)}
.ev.c-info{background:rgba(96,165,250,.16);color:var(--info)}
/* ---------- Timeline ---------- */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item:last-child{padding-bottom:2px}
.tl-item::before{content:"";position:absolute;left:-19.5px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--card);border:2.5px solid var(--pri2)}
.tl-item.t-ok::before{border-color:var(--ok)} .tl-item.t-bad::before{border-color:var(--bad)} .tl-item.t-warn::before{border-color:var(--warn)}
.tl-item .t-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tl-item .t-t{font-size:13px;font-weight:600}
.tl-item .t-when{font-size:11px;color:var(--tx3)}
.tl-item .t-d{font-size:12.5px;color:var(--tx2);margin-top:2px}
/* ---------- Modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto;background:rgba(5,7,12,.6);backdrop-filter:blur(4px)}
.modal-wrap.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:560px;box-shadow:var(--shadow);animation:modalin .16s ease;margin-bottom:5vh}
.modal.wide{max-width:780px}
@keyframes modalin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:15.5px;font-weight:700}
.modal-h .icon-btn{margin-left:auto}
.modal-b{padding:18px;max-height:64vh;overflow-y:auto}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
/* ---------- Toasts ---------- */
.toasts{position:fixed;bottom:18px;right:18px;z-index:120;display:flex;flex-direction:column;gap:9px;max-width:min(370px,calc(100vw - 36px))}
.toast{background:var(--card);border:1px solid var(--line2);border-left:3.5px solid var(--pri2);border-radius:var(--rad2);padding:11px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;animation:tin .2s ease;font-size:13px}
@keyframes tin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateX(14px);transition:all .25s}
.toast svg{width:16px;height:16px;flex:0 0 16px;margin-top:1px}
.toast .tt{font-weight:700;font-size:13px}
.toast .td{color:var(--tx2);font-size:12.5px;margin-top:1px}
.toast.ok{border-left-color:var(--ok)} .toast.ok svg{color:var(--ok)}
.toast.warn{border-left-color:var(--warn)} .toast.warn svg{color:var(--warn)}
.toast.bad{border-left-color:var(--bad)} .toast.bad svg{color:var(--bad)}
/* ---------- Bell panel / dropdown ---------- */
.bell-panel{position:fixed;top:60px;right:18px;width:min(390px,calc(100vw - 28px));max-height:min(540px,70vh);overflow-y:auto;background:var(--card);border:1px solid var(--line2);border-radius:var(--rad);box-shadow:var(--shadow);z-index:90;display:none}
.bell-panel.open{display:block;animation:modalin .15s ease}
.dd{position:fixed;z-index:90;background:var(--card);border:1px solid var(--line2);border-radius:var(--rad2);box-shadow:var(--shadow);padding:6px;min-width:210px;display:none}
.dd.open{display:block;animation:modalin .13s ease}
.dd button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--tx2)}
.dd button:hover{background:var(--hover);color:var(--tx)}
.dd button.danger{color:var(--bad)}
.dd button svg{width:14px;height:14px;flex:0 0 14px}
/* ---------- Command palette ---------- */
.palette-wrap{position:fixed;inset:0;z-index:110;display:none;background:rgba(5,7,12,.55);backdrop-filter:blur(4px);padding:12vh 16px 16px;justify-content:center}
.palette-wrap.open{display:flex}
.palette{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);height:fit-content;overflow:hidden;animation:modalin .15s ease}
.palette .p-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.palette .p-in svg{width:17px;height:17px;color:var(--tx3);flex:0 0 17px}
.palette .p-in input{border:none;background:none;padding:0;flex:1;font-size:15px;box-shadow:none}
.palette .p-list{max-height:330px;overflow-y:auto;padding:6px}
.p-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;font-size:13.5px;cursor:pointer;color:var(--tx2)}
.p-item svg{width:15px;height:15px;flex:0 0 15px}
.p-item .p-k{margin-left:auto;font-size:11px;color:var(--tx3)}
.p-item.sel{background:var(--pri-soft);color:var(--tx)}
.p-sec{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);padding:8px 12px 3px}
/* ---------- Empty state ---------- */
.empty{text-align:center;padding:42px 20px;color:var(--tx2)}
.empty svg{width:38px;height:38px;color:var(--tx3);margin-bottom:10px}
.empty h4{font-size:15px;font-weight:700;color:var(--tx)}
.empty p{font-size:13px;margin:5px auto 14px;max-width:380px}
/* ---------- Accordion ---------- */
.acc-item{border:1px solid var(--line);border-radius:var(--rad2);margin-bottom:9px;overflow:hidden;background:var(--card2)}
.acc-h{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;font-weight:600;font-size:13.5px;width:100%;text-align:left}
.acc-h:hover{background:var(--hover)}
.acc-h .acc-ic{margin-left:auto;color:var(--tx3);transition:transform .18s;flex:0 0 auto}
.acc-item.open .acc-ic{transform:rotate(180deg)}
.acc-b{display:none;padding:0 15px 14px;color:var(--tx2);font-size:13px}
.acc-item.open .acc-b{display:block}
/* ---------- Misc ---------- */
.muted{color:var(--tx2)} .dim{color:var(--tx3)} .b{font-weight:700}
.small{font-size:12px} .tiny{font-size:11px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.spread{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.mt8{margin-top:8px}.mt14{margin-top:14px}.mt20{margin-top:20px}.mb8{margin-bottom:8px}.mb14{margin-bottom:14px}
.callout{border-radius:var(--rad2);padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.callout svg{width:16px;height:16px;flex:0 0 16px;margin-top:1px}
.callout.info{background:rgba(96,165,250,.09);border-color:rgba(96,165,250,.3);color:var(--tx)}
.callout.warn{background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.3);color:var(--tx)}
.callout.ok{background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.3);color:var(--tx)}
.callout.bad{background:rgba(248,113,113,.09);border-color:rgba(248,113,113,.3);color:var(--tx)}
.callout .c-t{font-weight:700;margin-bottom:2px}
.code-box{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--rad3);padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;color:var(--tx2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv .k{color:var(--tx3);font-weight:600}
.insight{display:flex;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--rad2);background:var(--card2);align-items:flex-start}
.insight .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.insight .ic svg{width:17px;height:17px}
.insight h4{font-size:13.5px;font-weight:700}
.insight p{font-size:12.5px;color:var(--tx2);margin-top:2px}
.insight .act{margin-left:auto;flex:0 0 auto;align-self:center}
.hook-card{border:1px solid var(--line);border-radius:var(--rad2);padding:13px 14px;background:var(--card2);position:relative;transition:border-color .15s}
.hook-card.win{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 4px 18px rgba(52,211,153,.12)}
.hook-card .win-tag{position:absolute;top:-9px;right:10px}
.mini-metrics{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap}
.mini-metrics .mm{font-size:11px;color:var(--tx3);font-weight:600}
.mini-metrics .mm b{display:block;font-size:14px;color:var(--tx);font-variant-numeric:tabular-nums}
.comment{display:flex;gap:9px;margin:9px 0}
.comment .cbody{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12.5px;flex:1}
.comment .cmeta{font-size:10.5px;color:var(--tx3);margin-bottom:2px}
.chart-wrap{position:relative}
.chart-tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow2);border-radius:8px;padding:7px 10px;font-size:11.5px;display:none;z-index:5;white-space:nowrap}
.chart-tip .ct-t{font-weight:700;margin-bottom:3px}
.chart-tip .ct-r{display:flex;align-items:center;gap:6px}
.chart-tip .ct-r .sd{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);font-weight:600}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .sd{width:9px;height:9px;border-radius:3px}
.tgl-mini{font-size:11px;color:var(--tx3);cursor:pointer}
.up-in{animation:pulse-in .3s ease}
@keyframes pulse-in{from{transform:scale(.985);opacity:.6}to{transform:none;opacity:1}}
.progress-thin{height:5px;background:var(--card2);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.progress-thin>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
/* ---------- Responsive ---------- */
@media(max-width:1120px){
  :root{--sidebar-w:66px}
  .sidebar .brand-name,.sidebar .plan-pill,.sidebar .ws-name,.sidebar .ws-sub,.sidebar .ws-chev,.nav-item span:not(.nav-count),.nav-label,.side-user .nm,.side-user .rl,.side-user>div:last-child{display:none}
  .sidebar .ws-switch{justify-content:center;padding:8px}
  .nav-item{justify-content:center;padding:10px}

  .side-brand{justify-content:center;padding:14px 8px 8px}
  .side-foot{padding:10px 8px}
  .side-user{justify-content:center;border:none;background:none}
}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  :root{--sidebar-w:250px}
  .sidebar .brand-name,.sidebar .plan-pill,.sidebar .ws-name,.sidebar .ws-sub,.sidebar .ws-chev,.nav-item span:not(.nav-count),.nav-label,.side-user .nm,.sidebar .side-user>div:last-child{display:block}
  .sidebar .ws-switch{justify-content:flex-start;padding:9px 11px}
  .nav-item{justify-content:flex-start;padding:7.5px 10px}
  .side-brand{justify-content:flex-start;padding:16px 16px 10px}
  .nav-count{position:static;background:var(--card2);border:1px solid var(--line);color:var(--tx3);font-size:10.5px}
  .side-backdrop{position:fixed;inset:0;background:rgba(5,7,12,.5);z-index:39;display:none}
  .side-backdrop.open{display:block}
  .hamb{display:flex}
  .tb-search{display:none}
  .view{padding:14px}
  .tb-title p{display:none}
  .stat .v{font-size:20px}
  .modal-b{max-height:70vh}
}
</style>
</head>

<script>
'use strict';
/* ================================================================
   AdPilot — single-file app. Vanilla JS, no dependencies.
   Sections: helpers · icons · seeded mock data · store
   ================================================================ */

/* ---------------- helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261125);
const rnd=(a,b)=>a+R()*(b-a);
const ri=(a,b)=>Math.round(rnd(a,b));
const pick=arr=>arr[Math.floor(R()*arr.length)];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const sum=arr=>arr.reduce((t,n)=>t+n,0);
const avg=arr=>arr.length?sum(arr)/arr.length:0;
function inr(n){const v=Math.round(n);return '₹'+v.toLocaleString('en-IN')}
function inrC(n){if(n>=1e7)return '₹'+(n/1e7).toFixed(1).replace(/\.0$/,'')+'Cr';if(n>=1e5)return '₹'+(n/1e5).toFixed(1).replace(/\.0$/,'')+'L';if(n>=1000)return '₹'+Math.round(n/1000)+'k';return '₹'+Math.round(n)}
function pct(n,dp=1){return (n).toFixed(dp)+'%'}
function uid(p){return p+Math.random().toString(36).slice(2,8)}
const DAY=864e5;
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const dayOffset=n=>new Date(TODAY.getTime()-n*DAY);
const dateFmt=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
function ago(ts){const m=Math.max(1,Math.round((Date.now()-ts)/6e4));if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';return Math.round(h/24)+'d ago'}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function copyText(txt){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>App.toast('Copied to clipboard','ok'),()=>fallbackCopy(txt))}else fallbackCopy(txt)}
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');App.toast('Copied to clipboard','ok')}catch(e){App.toast('Copy failed — select the text manually','warn')}document.body.removeChild(ta)}
function downloadFile(name,content,mime){const b=new Blob([content],{type:mime||'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),500)}
const CHART_COLORS=['#8b7cff','#2dd4bf','#fbbf24','#f87171','#60a5fa','#f472b6','#34d399'];

/* ---------------- icons ---------------- */
const IC={
zap:'M13 2 3 14h7l-1 8 10-12h-7l1-8z',
grid:'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z',
bulb:'M9 18h6M10 21h4M12 3a6 6 0 0 1 3.5 10.9c-.6.5-.9 1.2-.9 2V16h-5.2v-.1c0-.8-.3-1.5-.9-2A6 6 0 0 1 12 3z',
trophy:'M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4zM7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3',

globe:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3a13.5 13.5 0 0 1 0 18 13.5 13.5 0 0 1 0-18z',

function evalRules(){
  const out=[];
  S.creatives.filter(c=>c.brand===S.brandId&&c.status==='Live').forEach(c=>{
    const r1=S.rules.find(r=>r.id==='r1'),r2=S.rules.find(r=>r.id==='r2'),r4=S.rules.find(r=>r.id==='r4');
    if(r1&&r1.on&&c.roas<r1.value) out.push({c,rule:r1,reason:'ROAS '+c.roas+' below floor '+r1.value});
    else if(r2&&r2.on&&c.ctr<r2.value) out.push({c,rule:r2,reason:'CTR '+pct(c.ctr,2)+' below '+r2.value+'%'});
    else if(r4&&r4.on&&c.hookRate<r4.value) out.push({c,rule:r4,reason:'Hook rate '+pct(c.hookRate)+' below '+r4.value+'%'});
  });
  return out;
}

/* ----- dashboard series ----- */
function genSeries(){
  const out={};
  BRANDS.forEach(b=>{
    const spend=[],rev=[],ctr=[],hook=[],cpa=[];
    let base=b.spend/30;
    for(let i=29;i>=0;i--){
      const dow=(6-i%7+7)%7;
      const wk=dow===0?1.18:dow===6?1.1:1;
      const drift=1+(29-i)*0.006;
      const noise=rnd(.88,1.12);
      const sp=Math.round(base*wk*drift*noise);
      const roas=rnd(2.2,3.3)+((29-i)>20?.15:0);
      const revenue=Math.round(sp*roas);
      spend.push({d:dayOffset(i).getTime(),v:sp});
      rev.push({d:dayOffset(i).getTime(),v:revenue});
      ctr.push({d:dayOffset(i).getTime(),v:+rnd(1.4,2.6).toFixed(2)});
      hook.push({d:dayOffset(i).getTime(),v:+rnd(24,36).toFixed(1)});
      cpa.push({d:dayOffset(i).getTime(),v:Math.round(rnd(180,340))});
    }
    out[b.id]={spend,revenue:rev,ctr,hook,cpa};
  });
  return out;
}
/* ----- dayparting ----- */
function genDaypart(){
  const perf=[],on=[];
  for(let r=0;r<7;r++){
    const prow=[],orow=[];
    for(let h=0;h<24;h++){
      const morning=(h>=7&&h<=10)?.62:0, eve=(h>=18&&h<=23)?1:0, night=(h===23||h<=1)?.8:0, lunch=(h>=12&&h<=14)?.5:0;
      const v=clamp(Math.round((morning+eve+night+lunch+0.08)*68+rnd(0,22)),6,100);
      prow.push(v); orow.push(h>=8&&h<=23);
    }
    perf.push(prow); on.push(orow);
  }
  return {perf,on};
}

/* ---------------- SVG chart helpers ---------------- */
let chartUid=0;
function lineChartSVG(opts){
  const {w=640,h=240,series,labels,yFmt=v=>v,area=true}=opts;
  const id='cg'+(++chartUid);
  const all=series.flatMap(s=>s.points);
  const min=Math.min(...all),max=Math.max(...all);
  const pad=(max-min)*0.12||1;
  const lo=Math.max(0,min-pad),hi=max+pad;
  const L=44,Rp=10,T=12,B=26;
  const iw=w-L-Rp,ih=h-T-B;
  const X=i=>L+iw*i/(labels.length-1);
  const Y=v=>T+ih*(1-(v-lo)/(hi-lo));
  const yTicks=4,yl=[],yg=[];
  for(let i=0;i<=yTicks;i++){const v=lo+(hi-lo)*i/yTicks;yl.push(yFmt(v));yg.push(Y(v))}
  let grid='',xl='';
  yg.forEach(y=>{grid+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(w-Rp)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>'});
  const xStep=Math.max(1,Math.floor(labels.length/(w>420?6:3)));
  labels.forEach((lb,i)=>{if(i%xStep===0||i===labels.length-1)xl+='<text x="'+X(i).toFixed(1)+'" y="'+(h-7)+'" fill="var(--tx3)" font-size="10" text-anchor="middle">'+esc(lb)+'</text>'});
  let defs='',paths='';
  series.forEach((s,si)=>{
    const c=s.color||CHART_COLORS[si%CHART_COLORS.length];
    defs+='<linearGradient id="'+id+'g'+si+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c+'" stop-opacity=".28"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></linearGradient>';
    const pts=s.points.map((p,i)=>X(i).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ');
    if(area)paths+='<polygon fill="url(#'+id+'g'+si+')" points="'+L+','+(T+ih)+' '+pts+' '+(w-Rp)+','+(T+ih)+'"/>';
    paths+='<polyline fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="'+pts+'"/>';
    s.points.forEach((p,i)=>{paths+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="2.1" fill="'+c+'"/>'});
  });
  const ylSvg=yl.map((t,i)=>'<text x="'+(L-8)+'" y="'+(yg[i]+3).toFixed(1)+'" fill="var(--tx3)" font-size="10" text-anchor="end">'+esc(String(t))+'</text>').join('');
  const dataAttrs=series.map((s,si)=>' data-s'+si+'="'+esc(s.name)+'|'+(s.color||CHART_COLORS[si%CHART_COLORS.length])+'|'+s.points.map(p=>p.v).join(',')+'"').join('');
  return '<div class="chart-wrap" style="width:100%" data-labels="'+esc(labels.join('|'))+'"'+dataAttrs+'>'+
    '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block" preserveAspectRatio="none" role="img">'+
    '<defs>'+defs+'</defs>'+grid+xl+ylSvg+paths+'</svg><div class="chart-tip"></div></div>';
}
function barChartSVG(opts){
  const {w=640,h=220,items,yFmt=v=>v}=opts;
  const max=Math.max(...items.map(i=>i.v))*1.15||1;
  const L=46,B=30,T=10;
  const iw=w-L-8,ih=h-T-B;
  const bw=Math.min(34,iw/items.length*.62);
  let bars='',xl='';
  const yl=[0,.25,.5,.75,1].map(f=>'<text x="'+(L-8)+'" y="'+(T+ih*(1-f)+3)+'" fill="var(--tx3)" font-size="10" text-anchor="end">'+esc(String(yFmt(max*f)))+'</text><line x1="'+L+'" y1="'+(T+ih*(1-f))+'" x2="'+(w-8)+'" y2="'+(T+ih*(1-f))+'" stroke="var(--line)" stroke-dasharray="3 4"/>').join('');
  items.forEach((it,i)=>{
    const x=L+iw*(i+.5)/items.length;
    const bh=ih*it.v/max;
    bars+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+(T+ih-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(2,bh).toFixed(1)+'" rx="4" fill="'+(it.c||'var(--pri)')+'" opacity=".92"><title>'+esc(it.label)+': '+esc(String(yFmt(it.v)))+'</title></rect>';
    xl+='<text x="'+x.toFixed(1)+'" y="'+(h-8)+'" fill="var(--tx3)" font-size="10" text-anchor="middle">'+esc(it.label)+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block">'+yl+bars+xl+'</svg>';
}
function sparkSVG(points,color,w=120,h=34){
  const min=Math.min(...points),max=Math.max(...points),rg=(max-min)||1;
  const pts=points.map((p,i)=>(i*w/(points.length-1)).toFixed(1)+','+((h-3)-(h-6)*(p-min)/rg).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" style="display:block"><polyline fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="'+pts+'"/></svg>';
}
function ringSVG(score,size=64,label){
  const r=size/2-5,c=2*Math.PI*r,val=clamp(score,0,100);
  const col=scoreColor(val);
  return '<span class="ring" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'">'+
   '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="6"/>'+
   '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+(c*val/100).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>'+
   '<span class="rv" style="font-size:'+Math.round(size*.26)+'px;color:'+col+'">'+Math.round(val)+(label?'<tspan></tspan>':'')+'</span></span>';
}
function bindChartTips(scope){
  $$('.chart-wrap',scope||document).forEach(wrap=>{
    const tip=$('.chart-tip',wrap); if(!tip)return;
    const labels=(wrap.dataset.labels||'').split('|');
    const series=[];
    Object.keys(wrap.dataset).forEach(k=>{if(/^s\d+$/.test(k)){const [n,c,v]=wrap.dataset[k].split('|');series.push({name:n,color:c,vals:v.split(',').map(Number)})}});
    const svg=$('svg',wrap);
    wrap.onmousemove=e=>{
      const rect=svg.getBoundingClientRect();
      const frac=clamp((e.clientX-rect.left)/rect.width,0,1);
      const idx=Math.min(labels.length-1,Math.max(0,Math.round(frac*(labels.length-1))));
      tip.innerHTML='<div class="ct-t">'+esc(labels[idx])+'</div>'+series.map(s=>'<div class="ct-r"><span class="sd" style="background:'+s.color+'"></span>'+esc(s.name)+': <b>'+s.vals[idx].toLocaleString('en-IN')+'</b></div>').join('');
      tip.style.display='block';
      const wr=wrap.getBoundingClientRect();
      let tx=e.clientX-wr.left+14, ty=e.clientY-wr.top-10;
      if(tx+tip.offsetWidth>wr.width-6)tx=tx-tip.offsetWidth-28;
      tip.style.left=tx+'px'; tip.style.top=Math.max(0,ty)+'px';
    };
    wrap.onmouseleave=()=>{tip.style.display='none'};
  });
}

  return '<span class="verdict '+m[0]+'">'+ic(m[1]==='Trending up'?'tup':m[1]==='Trophy'?'star':m[1]==='Alert'?'alert':'info',12)+' '+m[2]+'</span>';
}
function platBadge(p){const st=PLATFORM_STYLE[p]||{c:'#999',t:p};return '<span class="badge b-n"><span class="dot" style="background:'+st.c+'"></span>'+st.t+'</span>'}
function statusBadge(s){
  const m={Live:['b-ok','ok','Live'],Paused:['b-n','','Paused'],Learning:['b-info','pri','Learning']}[s]||['b-n','','?'];
  return '<span class="badge '+m[0]+'">'+(m[1]?'<span class="dot '+m[1]+'"></span>':'')+s+'</span>';
}
function fatigueBadge(f){
  const sev=f>=75?['b-bad','High']:f>=50?['b-warn','Warming']:['b-ok','Fresh'];
  return '<span class="badge '+sev[0]+'">'+sev[1]+' · '+Math.round(f)+'</span>';
}
function statCard(o){
  const d=o.delta;
  const dcls=d==null?'flat':d>0?'up':d<0?'dn':'flat';
  const dtx=d==null?'— baseline':(d>0?'+':'')+d+(o.deltaSuffix||'%');
  const arr=d>0?'tup':d<0?'tdn':'';
  return '<div class="card stat"><div class="lb">'+ic(o.icon||'bars',13)+' '+esc(o.label)+'</div>'+
   '<div class="v">'+o.value+'</div>'+
   '<div class="row" style="justify-content:space-between"><span class="delta '+dcls+'">'+(arr?ic(arr,12):'')+dtx+'</span>'+
   (o.spark?sparkSVG(o.spark,o.sc||'#8b7cff'):('<span class="tiny dim">'+esc(o.note||'')+'</span>'))+'</div></div>';
}
function scoreBar(label,val,cls){
  return '<div class="bar-row"><span class="bl">'+esc(label)+'</span><div class="bar '+(cls||'')+'"><i style="width:'+clamp(val,3,100)+'%;background:'+(cls?'':'linear-gradient(90deg,'+scoreColor(val)+','+scoreColor(val)+'cc)')+'"></i></div><span class="bv">'+Math.round(val)+'</span></div>';
}
function emptyState(icon,title,desc,btn){
  return '<div class="empty">'+ic(icon,38,1.6)+'<h4>'+esc(title)+'</h4><p>'+desc+'</p>'+(btn||'')+'</div>';
}
function sectionHead(title,hint,right){
  return '<div class="spread mb14"><div><h2 style="font-size:21px;font-weight:800;letter-spacing:-.4px">'+esc(title)+'</h2>'+(hint?'<p class="muted small mt8" style="max-width:760px">'+hint+'</p>':'')+'</div>'+(right?'<div class="row">'+right+'</div>':'')+'</div>';
}

let palSel=0,palItems=[];
App.openPalette=function(){
  $('#palette').classList.add('open');
  const inp=$('#paletteInput'); inp.value=''; buildPalette(''); inp.focus(); palSel=0; palHighlight();
};

$('#paletteInput').addEventListener('input',e=>{buildPalette(e.target.value);palSel=0;palHighlight()});
function palCommands(){
  const navs=Object.keys(VIEWS).map(k=>({icon:VIEWS[k].i,label:'Go to '+VIEWS[k].t,hint:VIEWS[k].g,run:()=>App.go(k)}));
  const acts=[
    {icon:'zap',label:'Run Auto-pilot check now',hint:'Optimize',run:()=>App.go('autopause')},
    {icon:'moon',label:'Toggle dark / light theme',hint:'Settings',run:()=>App.toggleTheme()},
    {icon:'upload',label:'Upload a new creative',hint:'Create',run:()=>App.go('upload')},
    {icon:'coins',label:'Apply all pending budget shifts',hint:'Optimize',run:()=>{App.go('budget');setTimeout(()=>App.applyAllBudget(),60)}},
    {icon:'wa',label:'Nudge pending WhatsApp approvals',hint:'Converse',run:()=>{App.go('approvals')}}
  ];
  return navs.concat(acts);
}
function buildPalette(q){
  q=(q||'').toLowerCase();
  const cmds=palCommands().filter(c=>!q||c.label.toLowerCase().includes(q)||c.hint.toLowerCase().includes(q));
  const creds=q?myCreatives().filter(c=>c.name.toLowerCase().includes(q)).slice(0,5).map(c=>({icon:'film',label:c.name,hint:'Creative · Hook '+Math.round(c.hookScore),run:()=>App.go('library')})):[];
  palItems=creds.concat(cmds.slice(0,9));
  const navSec=creds.length?'<div class="p-sec">Creatives</div>':'';
  let html=navSec+creds.map((c,i)=>palItem(c,i)).join('');
  html+=cmds.length?'<div class="p-sec">Views & commands</div>':'';
  html+=cmds.slice(0,9).map((c,i)=>palItem(c,i+creds.length)).join('');
  $('#paletteList').innerHTML=html||emptyState('search','No matches','Try “budget”, “hook” or a creative name.');
  $$('.p-item',$('#paletteList')).forEach(el=>{
    el.onclick=()=>{const i=+el.dataset.i;App.closePalette();palItems[i].run()};
  });
}
function palItem(c,i){return '<div class="p-item" data-i="'+i+'">'+ic(c.icon,15)+'<span style="flex:1">'+esc(c.label)+'</span><span class="p-k">'+esc(c.hint)+'</span></div>'}
function palHighlight(){$$('.p-item',$('#paletteList')).forEach((el,i)=>el.classList.toggle('sel',i===palSel))}
$('#paletteInput').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palItems.length-1,palSel+1);palHighlight()}
  else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(0,palSel-1);palHighlight()}
  else if(e.key==='Enter'&&palItems[palSel]){App.closePalette();palItems[palSel].run()}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();App.openPalette()}
  else if(e.key==='Escape'){
    if($('#palette').classList.contains('open'))App.closePalette();
    else if($('#modalWrap').classList.contains('open'))App.closeModal();
    else App.closeMenu();
  }
});
$('#palette').addEventListener('click',e=>{if(e.target===e.currentTarget)App.closePalette()});
$('#modalWrap').addEventListener('click',e=>{if(e.target===e.currentTarget)App.closeModal()});

const GROUPS=['Overview','Create','Optimize','Converse','Manage','Setup'];
function renderNav(){
  const cur=(location.hash||'#/dashboard').replace('#/','')||'dashboard';
  let html='';
  GROUPS.forEach(g=>{
    const keys=Object.keys(VIEWS).filter(k=>VIEWS[k].g===g);
    if(!keys.length)return;
    html+='<div class="nav-label">'+g+'</div>';
    keys.forEach(k=>{
      const v=VIEWS[k];
      let count='';
      if(k==='autopause'&&S.paused.length)count='<span class="nav-count hot">'+S.paused.length+'</span>';
      else if(k==='fatigue'&&myCreatives().filter(c=>c.fatigue>=75).length)count='<span class="nav-count hot">'+myCreatives().filter(c=>c.fatigue>=75).length+'</span>';
      else if(k==='approvals'){const p=S.approvals.filter(a=>a.status==='pending'||a.status==='sent').length;if(p)count='<span class="nav-count">'+p+'</span>'}
      else if(k==='budget'){const p=S.budget.filter(b=>!b.applied).length;if(p)count='<span class="nav-count">'+p+'</span>'}
      html+='<a class="nav-item'+(k===cur?' active':'')+'" href="#/'+k+'" title="'+esc(v.t)+'">'+ic(v.i,16.5)+'<span>'+esc(v.n)+'</span>'+count+'</a>';
    });
  });
  $('#nav').innerHTML=html;
}
function route(force){
  const id=(location.hash||'#/dashboard').replace('#/','')||'dashboard';
  const v=VIEWS[id]||VIEWS.dashboard;
  $('#tbTitle').textContent=v.t;
  $('#tbSub').textContent=v.s||'';
  $('#view').innerHTML=v.r();
  if(v.a)try{v.a()}catch(e){console.error(e);App.toast('Render error in '+id+': '+e.message,'bad')}
  renderNav();
  bindChartTips($('#view'));
  if(force)window.scrollTo(0,0);
  App.closeSidebar();
}
App.go=function(id){location.hash='#/'+id;if(('#'+id)===location.hash||location.hash==='#/'+id)route(true)};
window.addEventListener('hashchange',()=>route(true));

function rangeSlice(range){
  const s=S.series[S.brandId];
  const cut=s.spend.slice(-range);
  const prev=s.spend.slice(Math.max(0,-range*2),-range||undefined);
  const aggr=key=>{
    const cur=s[key].slice(-range),old=s[key].slice(Math.max(0,-range*2),-range||undefined);
    return {cur:avg(cur.map(p=>p.v)),old:avg(old.map(p=>p.v))};
  };
  const spendSum=sum(cut.map(p=>p.v)),revSum=sum(s.revenue.slice(-range).map(p=>p.v));
  const prevSpendSum=sum(prev.map(p=>p.v)),prevRevSum=sum(s.revenue.slice(Math.max(0,-range*2),-range||undefined).map(p=>p.v));
  const a=aggr('ctr'),b=aggr('hook'),c2=aggr('cpa');
  return {
    labels:cut.map(p=>dateFmt(new Date(p.d))),
    spend:cut,rev:s.revenue.slice(-range),ctr:s.ctr.slice(-range),hook:s.hook.slice(-range),cpa:s.cpa.slice(-range),
    spendSum,revSum,roas:spendSum?revSum/spendSum:0,
    dSpend:prevSpendSum?Math.round((spendSum/prevSpendSum-1)*100):0,
    dRev:prevRevSum?Math.round((revSum/prevRevSum-1)*100):0,
    dRoas:prevSpendSum?Math.round(((revSum/spendSum)/(prevRevSum/prevSpendSum)-1)*100):0,
    dCtr:Math.round((a.cur/a.old-1)*100),dHook:Math.round((b.cur/b.old-1)*100),dCpa:Math.round((c2.cur/c2.old-1)*100),
    ctrV:a.cur,hookV:b.cur,cpaV:c2.cur
  };
}
function pilotScore(c){return Math.round(.4*c.hookScore+.25*Math.min(c.roas*22,100)+.2*Math.min(c.ctr*30,100)+.15*Math.min(c.hookRate*2.2,100))}

    statCard({label:'Blended ROAS',value:d.roas.toFixed(2)+'×',delta:d.dRoas,icon:'target',spark:d.rev.map((p,i)=>p.v/(d.spend[i].v||1)),sc:'#2dd4bf'})+' '+

     lineChartSVG({w:640,h:250,labels:d.labels,series:[{name:'Spend',color:'#8b7cff',points:d.spend},{name:'Revenue',color:'#34d399',points:d.rev}],yFmt:v=>inrC(v)})+
   '</div></div>'+

     topMovers.map(c=>'<div class="spread" style="padding:7px 0;border-bottom:1px solid var(--line)"><div style="min-width:0"><div class="small b" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.name)+'</div><div class="tiny dim">'+esc(c.platform)+' · '+esc(c.format)+'</div></div><div class="row">'+ringSVG(pilotScore(c),40)+'</div></div>').join('')+

App.handleFiles=function(files){
  const f=files[0];

  box.style.display='block'; sc.innerHTML='';
  const url=f&&f.type.startsWith('image/')?URL.createObjectURL(f):null;
  const steps=['Reading frames (1-3s)…','Transcribing hook text + voice-over…','Scoring hook strength, clarity, emotion…','Comparing against 12,400 Indian D2C creatives…'];
  let i=0;
  const tick=()=>{
    body.innerHTML='<div class="row"><div class="creative-tile" style="width:92px;height:92px;flex:0 0 92px"><div class="ct-viz">'+(url?'<img src="'+url+'" style="width:100%;height:100%;object-fit:cover" alt="preview">':'<div class="ct-ph">'+ic('film',22,1.7)+'<span>'+esc(f?f.name.slice(0,18):'creative.mp4')+'</span></div>')+'</div></div>'+

    i++;
    if(i<=steps.length)setTimeout(tick,520); else finish();
  };
  const finish=()=>{
    const c=makeCreativeFromUpload(f?f.name:'new-creative.mp4',f&&f.type.startsWith('image/')?'Image':'Reel');

    logAct('New creative uploaded & scored','“'+c.name+'” · Hook '+c.hookScore+'/100 · '+verdictLabel(c.verdict),'user','upload');

    App.toast('Scored: Hook '+c.hookScore+'/100','ok',verdictLabel(c.verdict)+' · CTA '+c.ctaScore+'/100');

  };

};

function renderAb(){
  const tests=S.abTests.filter(t=>t.brand===S.brandId||t.status!=='draft');
  const running=S.abTests.filter(t=>t.status==='running').length;
  const projectedWinner=t=>{
    const scored=t.hooks.map(h=>({h,score:h.hookRate*.6+h.ctr*30*.4}));
    scored.sort((a,b)=>b.score-a.score);return scored[0];
  };
  const testCard=t=>{
    const pw=projectedWinner(t);
    const totalImp=sum(t.hooks.map(h=>h.imp));
    const tiles=t.hooks.map((h,hi)=>{
      const isWin=(t.status==='complete'&&t.winnerIdx!=null&&h===t.hooks[t.winnerIdx])||(t.status==='running'&&h===pw.h&&totalImp>10000);
      const grad=['linear-gradient(135deg,#8b7cff33,#8b7cff11)','linear-gradient(135deg,#2dd4bf33,#2dd4bf11)','linear-gradient(135deg,#fbbf2433,#fbbf2411)','linear-gradient(135deg,#f472b633,#f472b611)'][hi%4];
      return '<div class="hook-card'+(isWin?' win':'')+'" style="flex:1;min-width:200px">'+
        (isWin?'<span class="win-tag badge b-ok">'+ic('star',11)+' '+(t.status==='complete'?'Winner':'Projected winner')+'</span>':'')+
        '<div class="creative-tile" style="aspect-ratio:1/.62;margin-bottom:10px"><div class="ct-viz" style="background:'+grad+'"><div class="ct-ph">'+ic('film',20,1.6)+'<span>'+esc(t.platform)+' hook</span></div></div></div>'+
        '<div class="tiny dim" style="text-transform:uppercase;letter-spacing:.8px;font-weight:700">'+esc(h.label)+'</div>'+
        '<div class="small b" style="margin:4px 0 2px;min-height:34px">'+esc(h.text)+'</div>'+
        (h.imp?'<div class="mini-metrics"><div class="mm">Impressions<b>'+h.imp.toLocaleString('en-IN')+'</b></div><div class="mm">Hook rate<b>'+pct(h.hookRate)+'</b></div><div class="mm">CTR<b>'+pct(h.ctr,2)+'</b></div></div>':'<div class="tiny dim mt8">Not launched yet</div>')+
      '</div>';
    }).join('');
    return '<div class="card mb14"><div class="card-h"><h3>'+esc(t.name)+'</h3><span class="badge '+(t.status==='running'?'b-warn':t.status==='complete'?'b-ok':'b-n')+'">'+(t.status==='running'?ic('clock',11)+' Running':t.status==='complete'?ic('check',11)+' Complete':'Draft')+'</span><div class="right"><span class="tiny dim">'+esc(t.platform)+' · '+t.hooks.length+' hooks'+(t.started?' · started '+dateFmt(new Date(t.started)):'')+'</span>'+
      (t.status==='running'?'<button class="btn sm" onclick="App.advanceAb(\''+t.id+'\')">'+ic('play',12)+' Advance simulation</button><button class="btn sm ok" onclick="App.finishAb(\''+t.id+'\')">'+ic('check',12)+' Declare winner</button>':'')+
      (t.status==='draft'?'<button class="btn sm primary" onclick="App.startAb(\''+t.id+'\')">'+ic('play',12)+' Launch test</button><button class="btn sm danger" onclick="App.deleteAb(\''+t.id+'\')">'+ic('trash',12)+'</button>':'')+
      '</div></div><div class="card-b"><div class="row" style="align-items:stretch;flex-wrap:nowrap;overflow-x:auto;gap:12px">'+tiles+'</div>'+
      (t.status==='complete'?'<div class="callout ok mt14">'+ic('trophy',16)+'<div><b>Winner: '+esc(t.hooks[t.winnerIdx].label)+' — “'+esc(t.hooks[t.winnerIdx].text)+'”</b> at '+pct(t.hooks[t.winnerIdx].hookRate)+' hook rate (+'+ri(6,14)+'% vs runner-up). <button class="btn-link" onclick="App.briefFromAb(\''+t.id+'\')">Generate brief from winner →</button></div></div>':'')+
      '</div></div>';
  };
  return '<div class="view-head"><div><h2>Hook A/B on Reels & Shorts</h2><p class="sub">Face 2-4 hooks side-by-side on '+myCreatives().length+' creatives. AdPilot declares a projected winner once impressions pass significance.</p></div><div class="actions"><button class="btn primary" onclick="App.newAbModal()">'+ic('plus',14)+' New hook test</button></div></div>'+
   (running?'<div class="callout warn mb14">'+ic('clock',16)+'<div><b>'+running+' test'+(running>1?'s':'')+' running.</b> Auto-declaration at 50k impressions per hook.</div></div>':'')+
   (S.abSeed?'<div class="callout info mb14">'+ic('info',16)+'<div>Seed hook from leaderboard ready: <b>'+esc(S.abSeed)+'</b> — use it as hook A in the new test.</div></div>':'')+
   (tests.length?tests.map(testCard).join(''):emptyState('split','No hook tests yet','Create a test with 2-4 hooks — AdPilot will project the winner while it runs.','<button class="btn primary" onclick="App.newAbModal()">'+ic('plus',14)+' New hook test</button>'));

function fatigueSeries(id){
  S.fatigueSeries=S.fatigueSeries||{};
  if(S.fatigueSeries[id])return S.fatigueSeries[id];
  const c=S.creatives.find(x=>x.id===id);
  const start=Math.max(8,c.fatigue-ri(12,30));
  const pts=[];let v=start;
  for(let i=13;i>=0;i--){v=clamp(v+ (c.fatigue-start)/14 + rnd(-1.6,1.6),3,98);pts.push({d:dayOffset(i).getTime(),v:Math.round(v)})}
  S.fatigueSeries[id]=pts;return pts;
}

App.runUtmCheck=function(){
  const raw=$('#utmInput').value.trim();
  if(!raw){App.toast('Paste at least one URL first','warn');return}
  const urls=raw.split('\n').map(s=>s.trim()).filter(Boolean);
  let added=0;
  urls.forEach(url=>{
    const dup=S.utmChecks.find(u=>u.url===url);
    if(dup){dup.checks=analyzeUtm(url);dup.fixed=fixUtm(url);added++;return}
    S.utmChecks.unshift({url,checks:analyzeUtm(url),fixed:fixUtm(url)});added++;
  });
  logAct('UTM audit run',urls.length+' links · '+S.utmChecks.filter(u=>u.checks.some(c=>!c.ok)).length+' failing','auto','checksq');
  App.toast('Checked '+urls.length+' link'+(urls.length>1?'s':''),'ok',S.utmChecks.filter(u=>u.checks.some(c=>!c.ok)).length+' failing');
  route();
};
function analyzeUtm(url){
  const checks=[];
  const has=k=>new RegExp('[?&]'+k+'=').test(url);
  const get=k=>{const m=url.match(new RegExp('[?&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1]):''};
  if(!has('utm_source'))checks.push({k:'utm_source',ok:false,msg:'Missing — link is unattributed'});else checks.push({k:'utm_source',ok:get('utm_source')===get('utm_source').toLowerCase(),msg:get('utm_source')===get('utm_source').toLowerCase()?'Present & lowercase ✓':'“'+get('utm_source')+'” uses capitals — splits attribution rows'});
  if(!has('utm_medium'))checks.push({k:'utm_medium',ok:false,msg:'Missing — cannot separate paid vs organic'});else checks.push({k:'utm_medium',ok:true,msg:'Present: '+get('utm_medium')});
  if(!has('utm_campaign'))checks.push({k:'utm_campaign',ok:false,msg:'Missing — no campaign roll-up possible'});else{
    const v=get('utm_campaign');
    checks.push({k:'utm_campaign',ok:/^[a-z0-9-]+$/.test(v),msg:/^[a-z0-9-]+$/.test(v)?'“'+v+'” follows brand-slug convention ✓':/[\s_]/.test(v)?'“'+v+'” uses spaces/underscores — normalise to hyphens':'“'+v+'” contains capitals'});
  }
  checks.push({k:'utm_content',ok:has('utm_content'),msg:has('utm_content')?'Present: '+get('utm_content')+' ✓':'Missing — you won’t know which hook drove it'});
  const dup=S.utmChecks.some(u=>u.url!==url&&u.url.split('?')[1]===url.split('?')[1]);
  checks.push({k:'duplicates',ok:!dup,msg:dup?'Duplicate param string exists on another link':'No collisions found ✓'});
  return checks;
}
function fixUtm(url){
  const base=url.split('?')[0];
  const params=new URLSearchParams(url.split('?')[1]||'');
  const map={utm_source:(params.get('utm_source')||'meta').toLowerCase(),utm_medium:(params.get('utm_medium')||'cpc').toLowerCase(),utm_campaign:(params.get('utm_campaign')||'evergreen').toLowerCase().replace(/[\s_]+/g,'-')};
  const content=params.get('utm_content')||'hook-a';
  return base+'?utm_source='+map.utm_source+'&utm_medium='+map.utm_medium+'&utm_campaign='+map.utm_campaign+'&utm_content='+content;
}
App.applyUtmFix=function(i){
  const u=S.utmChecks[i];
  S.utmChecks[i]={url:u.fixed,checks:analyzeUtm(u.fixed),fixed:null};
  logAct('UTM fix applied','Rewrote to '+u.fixed,'user','checksq');
  App.toast('Fix applied','ok','Link rewritten with clean params');
  route();
};

/* ---------------- calendar ---------------- */
function renderCalendar(){
  const m=S.calMonth!==undefined?S.calMonth:TODAY.getMonth();
  const y=S.calYear!==undefined?S.calYear:TODAY.getFullYear();
  const first=new Date(y,m,1);
  const startDow=(first.getDay()+6)%7;
  const daysIn=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=startDow-1;i>=0;i--)cells.push({d:new Date(y,m-1,prevDays-i),dim:true});
  for(let d=1;d<=daysIn;d++)cells.push({d:new Date(y,m,d)});
  while(cells.length%7)cells.push({d:new Date(y,m+1,cells.length-daysIn-startDow+1),dim:true});
  const evFor=date=>S.calendar.filter(e=>e.date.toDateString()===date.toDateString());
  const mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const typeCls={launch:'c-ok',test:'c-pri',refresh:'c-warn',report:'c-info',shoot:'c-info',review:'c-warn'};
  return '<div class="view-head"><div><h2>Launch calendar</h2><p class="sub">Launches, hook-test waves, reshoots and report dates in one view — synced to your team.</p></div><div class="actions"><button class="icon-btn" onclick="App.calShift(-1)" title="Previous month">'+ic('chevl',16)+'</button><span class="b" style="min-width:130px;text-align:center">'+mn[m]+' '+y+'</span><button class="icon-btn" onclick="App.calShift(1)" title="Next month">'+ic('chevr',16)+'</button><button class="btn primary" onclick="App.newEventModal()">'+ic('plus',14)+' Add event</button></div></div>'+
   '<div class="card"><div class="card-b"><div class="cal">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<div class="dow">'+d+'</div>').join('')+
     cells.map(cell=>{
       const evs=evFor(cell.d);
       const isToday=cell.d.toDateString()===TODAY.toDateString();
       return '<div class="day'+(cell.dim?' dim':'')+(isToday?' today':'')+'" onclick="App.dayClick(\''+cell.d.toISOString().slice(0,10)+'\')"><div class="dnum">'+cell.d.getDate()+'</div>'+
        evs.slice(0,2).map(e=>'<div class="ev '+(typeCls[e.type]||'c-pri')+'">'+esc(e.title)+'</div>').join('')+(evs.length>2?'<div class="tiny dim">+'+(evs.length-2)+' more</div>':'')+'</div>';
     }).join('')+'</div></div></div>'+
   '<div class="card mt14"><div class="card-h"><h3>Upcoming</h3><span class="hint">next 14 days</span></div><div class="card-b">'+
     S.calendar.filter(e=>e.date>=TODAY&&e.date<=new Date(TODAY.getTime()+14*DAY)).sort((a,b)=>a.date-b.date).map(e=>'<div class="spread" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row"><span class="badge b-n">'+dateFmt(e.date)+'</span><span class="small b">'+esc(e.title)+'</span></div><span class="badge '+(typeCls[e.type]==='c-ok'?'b-ok':typeCls[e.type]==='c-warn'?'b-warn':'b-info')+'">'+e.type+'</span></div>').join('')+
   '</div></div>';
}

App.genReport=function(){
  const type=$('#repType').value,range=+$('#repRange').value;
  const d=rangeSlice(range);
  const mine=myCreatives();
  const top=mine.slice().sort((a,b)=>pilotScore(b)-pilotScore(a)).slice(0,8);
  let title,stats,rows;
  if(type==='Weekly creative digest'){
    title='Weekly creative digest — '+brandById(S.brandId).name;
    stats=[['Spend',inrC(d.spendSum),'wallet'],['Revenue',inrC(d.revSum),'tup'],['ROAS',d.roas.toFixed(2)+'×','target'],['Hook rate',pct(d.hookV),'zap']];
    rows=[['Creative','Spend','ROAS','Hook','Verdict']].concat(top.map(c=>[c.name,inrC(c.spend),c.roas+'×',Math.round(c.hookScore)+'/100',verdictLabel(c.verdict)]));
  }else if(type==='Creative scorecard'){
    title='Creative scorecard — '+brandById(S.brandId).name;
    stats=[['Creatives',String(mine.length),'film'],['Avg hook',Math.round(avg(mine.map(c=>c.hookScore)))+'/100','target'],['Winners',String(mine.filter(c=>c.verdict==='winner').length),'star'],['Fatiguing',String(mine.filter(c=>c.fatigue>=75).length),'flame']];
    rows=[['Creative','Hook','CTA','Clarity','Emotion','Urgency','Recall','Verdict']].concat(mine.map(c=>[c.name,Math.round(c.hookScore),Math.round(c.ctaScore),Math.round(c.sub.clarity),Math.round(c.sub.emotion),Math.round(c.sub.urgency),Math.round(c.sub.recall),verdictLabel(c.verdict)]));
  }else if(type==='Budget efficiency report'){
    title='Budget efficiency — '+brandById(S.brandId).name;
    stats=[['Spend',inrC(d.spendSum),'wallet'],['CPA',inr(d.cpaV),'coins'],['ROAS',d.roas.toFixed(2)+'×','target'],['Losers live',String(mine.filter(c=>c.status==='Live'&&c.verdict==='loser').length),'alert']];
    rows=[['Creative','Spend','Revenue','ROAS','CPA','Status']].concat(mine.slice().sort((a,b)=>a.roas-b.roas).map(c=>[c.name,inrC(c.spend),inrC(c.revenue),c.roas+'×',inr(c.cpa),c.status]));
  }else{
    title='UTM & attribution audit';
    const failing=S.utmChecks.filter(u=>u.checks.some(c=>!c.ok));
    stats=[['Links',String(S.utmChecks.length),'link'],['Failing',String(failing.length),'alert'],['Issues',String(S.utmChecks.reduce((t,u)=>t+u.checks.filter(c=>!c.ok).length,0)),'x'],['Auto-fixable',String(S.utmChecks.filter(u=>u.fixed).length),'spark']];
    rows=[['Link','Status','Issues']].concat(S.utmChecks.map(u=>[u.url,u.checks.some(c=>!c.ok)?'FAIL':'PASS',u.checks.filter(c=>!c.ok).length]));
  }
  S.reports.unshift({title,at:Date.now(),stats,rows});
  logAct('Report generated',title+' ('+range+'d)','auto','bars');
  App.toast('Report generated','ok',title);route();
};
App.dlReport=function(i){
  const r=S.reports[i];
  const csv=r.rows.map(row=>row.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  downloadFile(r.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)+'.csv',csv,'text/csv');
  App.toast('Report CSV downloaded','ok');
};
App.delReport=function(i){S.reports.splice(i,1);App.toast('Report deleted','info');route()};
